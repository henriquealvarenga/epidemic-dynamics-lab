name: Publicar no GitHub Pages

# O site é estático (HTML/CSS/JS puro, sem etapa de compilação): a publicação
# apenas empacota o repositório como está e envia ao Pages.
#
# Dois jobs:
#   1. testes    → node tests/run.js. Roda também em PR. Bloqueia a publicação.
#   2. publicar  → empacota e envia ao Pages. Só em push para main.
#
# Sem filtro de `paths` de propósito: como a publicação empacota o repositório
# inteiro (`path: '.'`), qualquer arquivo pode afetar o site. Um filtro que
# esquecesse um diretório faria mudanças pararem de publicar em silêncio —
# é exatamente o que aconteceu no projeto irmão do Exame do Estado Mental,
# onde `atividades/**` ficou de fora da lista e o front-end deixou de subir.
#
# ATENÇÃO: o job de testes é bloqueante. Se ele falhar, o site NÃO é
# republicado e o conteúdo anterior continua no ar. Confira a aba Actions
# quando um push não aparecer no site.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Sem `npm install`: o runner usa apenas node:assert nativo.
      - name: Rodar a suíte
        run: node tests/run.js

      # clean_latex converte comandos LaTeX do .bib. Um erro ali não quebra
      # nada — só vaza LaTeX cru para a bibliografia que o aluno lê. Daí o
      # autoteste. Python 3 já vem no runner; o script não tem dependências.
      - name: Autoteste do conversor de bibliografia
        run: python3 scripts/bib2json.py --selftest

      # O .json e o .js são derivados do .bib e versionados. Se alguém editar
      # o .bib e esquecer de rodar o conversor, o site publica a bibliografia
      # antiga sem nenhum sinal de erro.
      #
      # --check compara só os `items`: o cabeçalho gerado tem um timestamp, e
      # um `git diff` cru reprovaria todo build.
      - name: Conferir se as referências geradas estão em dia
        run: python3 scripts/bib2json.py --check

      # Mesma armadilha, outra lista: o corpo da página Leituras é derivado
      # de references/leituras.bib. Este gate confere os três derivados —
      # _leituras-refs.md, leituras.html e os números citados na prosa (a meta
      # description, a chamada na tela de Bibliografia).
      #
      # O Quarto NÃO roda aqui e não precisa: o bloco raw atravessa o Pandoc
      # verbatim, então conferir leituras.html é procurar o texto gerado
      # dentro da página (normalizando entidades HTML, que o Pandoc reemite
      # como caractere). Instalar o Quarto no runner para renderizar de novo
      # custaria minutos por build para chegar à mesma resposta.
      - name: Conferir se a página Leituras está em dia
        run: python3 scripts/leituras2md.py --check

  publicar:
    name: Publicar
    needs: testes
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar o Pages
        uses: actions/configure-pages@v6

      # O site é servido a partir da raiz do repositório, mas o repositório
      # também guarda coisas que não são do aluno: notas internas, testes,
      # scripts de manutenção. Sem esta etapa, `path: '.'` publicava tudo —
      # docs-internos/RASCUNHO_*.md ficaria legível na URL do site.
      # Copiar para _site/ preserva a estrutura de caminhos (inclusive o
      # .nojekyll) e só tira o que não deve ir ao ar.
      #
      # `_leituras-refs*` é prefixo de propósito: pega o fragmento de include
      # (.md) e também os subprodutos que um `quarto render` sem argumento
      # deixa para trás (.html órfão + _files/). Esses dois estão no
      # .gitignore, então nem chegam ao checkout — o exclude é a segunda
      # tranca, para o caso de alguém forçar o commit deles.
      - name: Montar o site sem os arquivos internos
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '_site' \
            --exclude '_scratch' \
            --exclude '_sources' \
            --exclude 'docs-internos' \
            --exclude 'supabase' \
            --exclude 'tests' \
            --exclude 'scripts' \
            --exclude '*.qmd' \
            --exclude '_leituras-refs*'
          echo "Conteúdo publicado:"
          ls -A _site

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
